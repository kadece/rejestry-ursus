name: Aktualizacja wykazów

# UWAGA — wymagane ustawienie po stronie GitHuba:
#   Settings → Pages → Source = "GitHub Actions"
# Przy "Deploy from a branch" GitHub publikuje README przez Jekylla,
# a kroki configure-pages / deploy-pages kończą się błędem.
#
# Uruchamiane 1. i 15. dnia miesiąca o 06:00 UTC.
# Rejestr prowadzony przez Urząd jest uzupełniany z opóźnieniem, dlatego
# dwa przebiegi w miesiącu dają świeże dane bez codziennego szumu w historii.
on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:        # ręczne uruchomienie z zakładki Actions
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'templates/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zależności
        # pdfplumber jest potrzebny dla roczników 2019–2020 (urząd publikował
        # wtedy wyłącznie PDF-y). Dla nowszych lat wystarcza openpyxl.
        run: python -m pip install --quiet openpyxl pdfplumber

      - name: Pobierz świeże dane i zbuduj stronę
        id: fetch
        # Gdy ursus.um.warszawa.pl jest nieosiągalny (albo blokuje adresy
        # runnerów GitHuba), nie wywalamy całego przebiegu — niżej jest
        # fallback na dane zapisane w repozytorium.
        continue-on-error: true
        run: |
          set -o pipefail
          python build.py --all 2>&1 | tee build.log

      - name: Diagnostyka pobierania
        # Zapisuje do build.log to, co runner faktycznie dostaje ze źródła.
        # Pozwala odróżnić „WAF blokuje adresy centrów danych” od „zmienił się
        # układ strony”. Bez tego w logu widać tylko „0 załączników”.
        if: steps.fetch.outcome == 'failure'
        continue-on-error: true
        run: |
          {
            echo ""
            echo "=== DIAGNOSTYKA ŹRÓDŁA ==="
            curl -sS -o /dev/null \
              -w 'status=%{http_code} type=%{content_type} size=%{size_download} ip=%{remote_ip}\n' \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36' \
              https://ursus.um.warszawa.pl/wykazy-za-rok-2026 || echo "curl nie powiódł się"
            echo "--- pierwsze 400 znaków odpowiedzi ---"
            curl -sS -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36' \
              https://ursus.um.warszawa.pl/wykazy-za-rok-2026 2>/dev/null | head -c 400 || true
            echo ""
            echo "=== KONIEC DIAGNOSTYKI ==="
          } | tee -a build.log

      - name: Renderuj z danych w repozytorium
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::Pobieranie ze źródła nie powiodło się — renderuję z data/*.json"
          python build.py --all --render-only 2>&1 | tee -a build.log

      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Brak zmian — dane bez modyfikacji."
          else
            git commit -m "Aktualizacja wykazów $(date +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          # Włącza GitHub Pages, jeśli nie są jeszcze włączone — dzięki temu
          # pierwszy przebieg nie wymaga ręcznego kliknięcia w Settings → Pages.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
